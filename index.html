</div>

  const validTie=n=>{const next=byId.get(n.tie);return next&&next.p===n.p&&next.s===n.s&&Math.abs(next.t-n.t-n.d)<=1?next:null;};
  const tied=new Set(displayNotes.map(validTie).filter(Boolean).map(n=>n.id));

    if(!prev||b.meter.beats!==prev.meter.beats||b.meter.unit!==prev.meter.unit)metas.push([b.t,0,[255,88,4,b.meter.beats,Math.log2(b.meter.unit),24,8]]);

    const channelOf=n=>piece.feel?(n.channel??s):s;
    const channels=new Set(notes.map(channelOf));
    for(const channel of channels)outputEvents.push([0,-2,[192|channel,0]]);

      if(tied.has(n.id))continue;
      let micro=piece.feel?n.micro||0:0,on=Math.max(0,n.t+micro), tail=n, end=n.t+n.d;
      for(let i=0;i<displayNotes.length;i++){const next=validTie(tail);if(!next)break;end=next.t+next.d;tail=next;}
      if(n.art==='staccato'&&tail===n)end=n.t+n.d*.54;
      else if(n.art==='fermata'&&tail===n)end=n.t+n.d*1.4;

      const channel=channelOf(n), v=clamp(Math.round(n.v*(({pp:.36,p:.55,mp:.75,mf:.93,f:1.13,ff:1.27})[n.dyn]||1)*(n.art==='accent'?1.22:1)),1,127);

    }

  parts.unshift(new Uint8Array(chunk('MThd',[0,1,...int(tracks.length,2),...int(PPQ,2)])));

}
function xmlScore(){
  const notes=piece.notes.filter(n=>n.s<piece.staves), spelledTypes=['whole','half','quarter','eighth','16th','32nd'];
  const safe=escapeHTML, lastTie=new Set(notes.filter(n=>n.tie).map(n=>n.tie));
  const attrsFor=(bars,index)=>{
    const b=bars[index],prev=bars[index-1];let attrs='';
    if(!prev)attrs+='<divisions>'+PPQ+'</divisions>';
    if(!prev||b.key!==prev.key||b.minor!==prev.minor)attrs+='<key><fifths>'+b.key+'</fifths><mode>'+(b.minor?'minor':'major')+'</mode></key>';
    if(!prev||b.meter.beats!==prev.meter.beats||b.meter.unit!==prev.meter.unit)attrs+='<time><beats>'+b.meter.beats+'</beats><beat-type>'+b.meter.unit+'</beat-type></time>';
    if(!prev)attrs+='<staves>'+piece.staves+'</staves>';
    for(let s=0;s<piece.staves;s++){
      const current=clefFor(b,s);
      if(prev&&current===clefFor(prev,s))continue;
      const clef={treble:['G',2],bass:['F',4],alto:['C',3],tenor:['C',4]}[current];
      attrs+='<clef number="'+(s+1)+'"><sign>'+clef[0]+'</sign><line>'+clef[1]+'</line></clef>';
    }
    return attrs?'<attributes>'+attrs+'</attributes>':'';
  };
  let xml='<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 4.0 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n<score-partwise version="4.0"><work><work-title>'+safe(piece.title)+'</work-title></work><identification><creator type="composer">'+safe(piece.credit)+'</creator></identification><part-list><score-part id="P1"><part-name>Piano</part-name><score-instrument id="P1-I1"><instrument-name>Piano</instrument-name></score-instrument><midi-instrument id="P1-I1"><midi-channel>1</midi-channel><midi-program>1</midi-program></midi-instrument></score-part></part-list><part id="P1">';
  for(const b of timeSig){
    const prev=timeSig[b.i-1];
    xml+='<measure number="'+(b.i+1)+'">'+attrsFor(timeSig,b.i);
    if(!prev||b.bpm!==prev.bpm)xml+='<direction placement="above"><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>'+b.bpm+'</per-minute></metronome></direction-type><sound tempo="'+b.bpm+'"/></direction>';
    if(b.change.mark)xml+='<direction placement="above"><direction-type><rehearsal>'+safe(b.change.mark)+'</rehearsal></direction-type></direction>';
    let wrote=false;
    const forward=(d,voice,s)=>'<forward><duration>'+d+'</duration><voice>'+voice+'</voice><staff>'+(s+1)+'</staff></forward>';
    for(let s=0;s<piece.staves;s++){
      const list=notes.filter(n=>n.s===s&&n.t<b.end&&n.t+n.d>b.t).sort((a,c)=>a.t-c.t||a.d-c.d||a.p-c.p);
      const voices=[];
      for(const n of list){
        const start=Math.max(n.t,b.t),end=Math.min(n.t+n.d,b.end);
        let voice=voices.find(v=>v.end<=start||v.start===start&&v.end===end);
        if(!voice){voice={notes:[],end:b.t,start:-1};voices.push(voice);}
        voice.notes.push({n,start,end,chord:voice.start===start&&voice.end===end});voice.start=start;voice.end=end;
      }
      if(!voices.length)voices.push({notes:[],end:b.t});
      for(let i=0;i<voices.length;i++){
        const voice=s*100+i+1;let at=b.t;
        if(wrote)xml+='<backup><duration>'+b.length+'</duration></backup>';
        wrote=true;
        const gap=end=>{
          if(end<=at)return;
          if(i===0){
            for(const r of splitRest(at,end,b)){
              const type=writtenDuration(r.d);
              xml+='<note><rest/><duration>'+r.d+'</duration><voice>'+voice+'</voice><type>'+spelledTypes[type.i]+'</type>'+'<dot/>'.repeat(type.dots)+'<staff>'+(s+1)+'</staff></note>';
              at=r.t+r.d;
            }
          }
          if(end>at)xml+=forward(end-at,voice,s);
          at=end;
        };
        if(!voices[i].notes.length){xml+='<note><rest measure="yes"/><duration>'+b.length+'</duration><voice>'+voice+'</voice><staff>'+(s+1)+'</staff></note>';continue;}
        for(const {n,start,end,chord} of voices[i].notes){
          if(!chord)gap(start);
          const w=spelling(n,b),step=w.name[0],duration=end-start, written=writtenDuration(duration);
          const tiedIn=start>n.t||lastTie.has(n.id),tiedOut=end<n.t+n.d||!!n.tie;
          const articulations={staccato:'<staccato/>',accent:'<accent/>',tenuto:'<tenuto/>'}[n.art];
          const dynamics=n.dyn?'<direction placement="below"><direction-type><dynamics><'+n.dyn+'/></dynamics></direction-type><staff>'+(s+1)+'</staff></direction>':'';
          if(!chord&&start===n.t)xml+=dynamics;
          xml+='<note dynamics="'+Math.round(n.v/90*100)+'">'+(chord?'<chord/>':'')+'<pitch><step>'+step+'</step>'+(w.acc?'<alter>'+w.acc+'</alter>':'')+'<octave>'+Math.floor(w.degree/7)+'</octave></pitch><duration>'+duration+'</duration>';
          if(tiedIn)xml+='<tie type="stop"/>';if(tiedOut)xml+='<tie type="start"/>';
          xml+='<voice>'+voice+'</voice><type>'+spelledTypes[written.i]+'</type>'+'<dot/>'.repeat(written.dots);
          if(n.courtesy)xml+='<accidental>'+({0:'natural',1:'sharp','-1':'flat'})[w.acc]+'</accidental>';
          if(written.tuplet)xml+='<time-modification><actual-notes>3</actual-notes><normal-notes>2</normal-notes></time-modification>';
          xml+='<staff>'+(s+1)+'</staff>';
          if(tiedIn||tiedOut||n.art==='fermata'||articulations||n.finger){
            xml+='<notations>'+(tiedIn?'<tied type="stop"/>':'')+(tiedOut?'<tied type="start"/>':'')+(n.art==='fermata'?'<fermata/>':'')+(n.finger?'<technical><fingering>'+n.finger+'</fingering></technical>':'')+(articulations?'<articulations>'+articulations+'</articulations>':'')+'</notations>';
          }
          xml+='</note>';
          if(!chord)at=end;
        }
        gap(b.end);
      }
    }
    if(b.i===timeSig.length-1)xml+='<barline location="right"><bar-style>light-heavy</bar-style></barline>';
    xml+='</measure>';
  }
  return xml+'</part></score-partwise>';
}
function printScore(){
  const old=$('score-scroll').parentElement.querySelector('.print-sheet');old?.remove();
  const sections=[];
  for(let i=0;i<geometry.length;){
    const bars=geometry.slice(i,i+3);let x=17,html='';
    for(const original of bars){
      const first=original.i===i,b={...original};
      if(first){
        const added=(b.clefChange?0:27)+(b.keyChange?0:Math.abs(b.key)*9)+(b.meterChange?0:28);
        b.lead+=added;b.w+=added;
      }
      html+=barMarkup(b,x,b.i,b.i===geometry.length-1,false,first);x+=b.w;
    }
    sections.push('<svg viewBox="0 0 '+(x+6)+' '+(staffY(piece.staves-1)+50)+'">'+html+'</svg>');i+=bars.length;
  }
  const printed=document.createElement('div');printed.className='print-sheet';printed.style.display='none';printed.innerHTML=sections.join('');
  $('score-scroll').after(printed);window.print();
}
function validImport(content){
  const src=content?.format==='notely'&&content.score;
  const timeOk=t=>t&&Number.isInteger(t.beats)&&t.beats>=1&&t.beats<=32&&[1,2,4,8,16,32].includes(t.unit);
  const keyOk=k=>Number.isInteger(k)&&k>=-7&&k<=7;
  const tempoOk=k=>Number.isFinite(k)&&k>=24&&k<=300;
  if(!src||typeof src.title!=='string'||!timeOk(src.time)||!keyOk(src.key)||!tempoOk(src.bpm)||![1,2].includes(src.staves)||!Number.isInteger(src.bars)||src.bars<1||src.bars>512||!Array.isArray(src.notes)||src.notes.length>30000)throw Error('This file is not a supported Notely project.');
  const ids=new Map(), result=score(src.title.slice(0,100),{
    credit:String(src.credit||'').slice(0,100),time:src.time,key:src.key,bpm:src.bpm,staves:src.staves,bars:src.bars,minor:!!src.minor,feel:!!src.feel,detail:displayDetail.some(x=>x[0]===src.detail)?src.detail:'basic'
  });
  const validClef=k=>clefs.some(x=>x[0]===k);
  for(const k of ['treble','bass'])if(validClef(src[k]))result[k]=src[k];
  if(src.source)result.source=safeSource(src.source);
  for(const [i,b] of Object.entries(src.measures||{})){
    if(!/^\d+$/.test(i)||Number(i)>=src.bars||!b||typeof b!=='object')continue;
    const props={mark:String(b.mark||'').slice(0,24),recovery:!!b.recovery};
    if(timeOk(b.time))props.time=b.time;if(keyOk(b.key))props.key=b.key;if(tempoOk(b.bpm))props.bpm=b.bpm;
    if(typeof b.minor==='boolean')props.minor=b.minor;
    for(const k of ['treble','bass'])if(validClef(b[k]))props[k]=b[k];
    result.measures[i]=props;
  }
  result.notes=src.notes.map(n=>{
    if(!Number.isInteger(n?.p)||n.p<0||n.p>127||!Number.isInteger(n.t)||n.t<0||n.t>2000000||!Number.isInteger(n.d)||n.d<1||n.d>2000000||![0,1].includes(n.s))throw Error('The score contains an invalid note.');
    const sanitized=note(n.p,n.t,n.d,n.s,clamp(Number(n.v)||78,1,127),{degree:Number.isInteger(n.degree)&&n.degree>=-8&&n.degree<=80?n.degree:null,spell:n.spell===-1?-1:n.spell===1?1:undefined,courtesy:!!n.courtesy,art:['none','staccato','accent','tenuto','fermata'].includes(n.art)?n.art:'none',dyn:['pp','p','mp','mf','f','ff'].includes(n.dyn)?n.dyn:'',finger:clamp(Math.floor(Number(n.finger))||0,0,5),micro:clamp(Number(n.micro)||0,-1,1),microLength:clamp(Number(n.microLength)||0,-1,1),channel:clamp(Math.floor(Number(n.channel))||0,0,15)});
    ids.set(n.id,sanitized.id);return sanitized;
  });
  result.notes.forEach((n,i)=>{const old=src.notes[i];if(ids.has(old.tie))n.tie=ids.get(old.tie);if(ids.has(old.link))n.link=ids.get(old.link);});
  if(Array.isArray(src.pedal))result.pedal=src.pedal.filter(e=>Number.isInteger(e?.t)&&e.t>=0&&e.t<2000000&&Number.isInteger(e.value)&&e.value>=0&&e.value<=127&&Number.isInteger(e.channel)&&e.channel>=0&&e.channel<16).slice(0,100000).sort((a,b)=>a.t-b.t);
  if(Array.isArray(src.raw?.events)&&src.raw.events.length<=30000&&tempoOk(src.raw.bpm)){
    const validEvent=n=> Number.isInteger(n?.p)&&n.p>=0&&n.p<=127&&Number.isFinite(n.on)&&Number.isFinite(n.off)&&n.on>=0&&n.off>=n.on&&n.off<86400&&Number.isFinite(n.v)&&n.v>=1&&n.v<=127;
    if(src.raw.events.every(validEvent)){
      const controls=Array.isArray(src.raw.pedal)?src.raw.pedal.filter(e=>Number.isFinite(e?.on)&&e.on>=0&&Number.isInteger(e.channel)&&e.channel>=0&&e.channel<16&&Number.isInteger(e.value)&&e.value>=0&&e.value<=127):[];
      result.raw={version:1,bpm:src.raw.bpm,duration:src.raw.duration,events:src.raw.events,pedal:controls};
    }
  }
  return result;
}
async function importFile(file){
  if(!file)return;
  if(file.size>15000000){toast('Choose a MIDI or Notely file smaller than 15 MB.');return;}
  try{
    let incoming;
    if(/\.midi?$/i.test(file.name)){
      incoming=scoreFromMidi(parseMidi(await file.arrayBuffer()),file.name.replace(/\.midi?$/i,''));
    }else{
      const data=JSON.parse(await file.text());incoming=validImport(data);
      for(const v of (Array.isArray(data.score.versions)?data.score.versions:[]).slice(0,60)){
        try{const {versions,...validated}=validImport({format:'notely',score:v.score});incoming.versions.push({id:nextId(),name:String(v.name||'Version').slice(0,70),when:v.when,score:validated});}catch{}
      }
    }
    ensureLength(incoming);works[incoming.id]=incoming;setMode('compose');switchScore(incoming.id);toast('Score imported.');
  }catch(error){toast(error.message||'Could not open this file.');}
}
function scoreActions(){
  openDialog('Score actions',group(button('action-versions','Version history','button','clock')+button('action-duplicate','Save as new score','button','copy'))+
    group(button('action-project','Notely project','button','download')+button('action-midi','Export MIDI','button','download'))+
    group(button('action-xml','Export MusicXML','button','download')+button('action-print','Print score','button','score'))+
    (piece.raw?button('action-original','Export original note events','button','download'):'')+
    (piece.source?'<a class="hint" target="_blank" rel="noopener" href="'+escapeHTML(safeSource(piece.source))+'">View the public-domain source</a>':''));
  const close=()=>$('dialog').close();
  $('action-versions').onclick=versionDialog;
  $('action-duplicate').onclick=()=>openDialog('Save as new score',textField('duplicate-name','Title',piece.title+' (copy)'),'Create score',form=>{
    const p=duplicate(form.get('duplicate-name'));switchScore(p.id);toast('Saved as a new score.');
  });
  $('action-project').onclick=()=>{download(JSON.stringify({format:'notely',version:1,score:piece},null,2),filename()+'.notely','application/json');close();};
  $('action-midi').onclick=()=>{download(midiBytes(),filename()+'.mid','audio/midi');close();};
  $('action-xml').onclick=()=>{download(xmlScore(),filename()+'.musicxml','application/vnd.recordare.musicxml+xml');close();};
  $('action-print').onclick=()=>{close();printScore();};
  if(piece.raw)$('action-original').onclick=()=>{download(JSON.stringify(piece.raw,null,2),filename()+'-original-notes.json','application/json');close();};
}

function attachStudio(){
  icons();
  attachSheet();attachPiano();renderPiano();render();setMode('compose');
  $('catalog').onclick=e=>{const song=e.target.closest('[data-song]');if(song)switchScore(song.dataset.song);};
  $('open-library').onclick=()=>{const menu=$('library');const open=menu.classList.toggle('open');$('open-library').setAttribute('aria-expanded',String(open));};
  $('new-score').onclick=()=>openDialog('New score',textField('new-title','Score title','Untitled score'),'Create score',form=>newScore(form.get('new-title')));
  $('library-import').onclick=()=>$('file').click();
  $('file').onchange=e=>{const file=e.target.files[0];e.target.value='';importFile(file);};
  document.querySelector('.brand').onclick=e=>{e.preventDefault();setMode('compose');};
  for(const name of ['compose','practice','record'])$(name).onclick=()=>setMode(name);
  $('undo').onclick=()=>goHistory('undo');$('redo').onclick=()=>goHistory('redo');
  $('save').onclick=saveVersionDialog;$('more').onclick=scoreActions;
  $('score-settings').onclick=scoreDialog;$('bar-settings').onclick=barDialog;$('add-bar').onclick=()=>insertBar();
  $('appearance').onclick=appearanceDialog;$('tuner').onclick=tunerDialog;$('help').onclick=helpDialog;
  $('input-settings').onclick=inputDialog;$('loop').onclick=loopDialog;$('volume-button').onclick=soundDialog;
  $('label-cycle').onclick=()=>{const labels=['off','above','below'];pref.labels=labels[(labels.indexOf(pref.labels)+1)%labels.length];storeLocal();renderHeader();renderScore();renderInspector();};
  const zoom=delta=>{pref.zoom=clamp(pref.zoom+delta,60,170);storeLocal();renderHeader();renderScore();setCursor(cursor);};
  $('zoom-out').onclick=()=>zoom(-10);$('zoom-in').onclick=()=>zoom(10);
  const octave=delta=>{pref.octave=clamp(pref.octave+delta,0,6);storeLocal();renderPiano();};
  $('octave-down').onclick=()=>octave(-1);$('octave-up').onclick=()=>octave(1);
  const toggle=()=>playing||recoveryTimer?stopPlayback(false):startPlayback();
  $('play').onclick=toggle;$('stop').onclick=()=>stopPlayback(true);
  $('rewind').onclick=()=>{const wasPlaying=playing;stopPlayback(true);if(wasPlaying)startPlayback();};
  $('seek').oninput=e=>{const tick=Number(e.target.value);stopPlayback(false);setCursor(tick);};
  $('bpm').onchange=e=>{const bpm=clamp(Math.round(Number(e.target.value))||piece.bpm,24,300);if(bpm===piece.bpm){e.target.value=bpm;return;}touch(()=>piece.bpm=bpm);};
  $('metronome').onclick=()=>{pref.metro=!pref.metro;storeLocal();renderHeader();if(pref.metro&&!playing){audioReady();clickTrack(audio.currentTime,true);}};
  $('modal-form').onsubmit=handleDialogSubmit;
  $('close-modal').onclick=()=>$('dialog').close();
  $('dialog').addEventListener('close',()=>{if(modalType==='tuner'&&micListeners.has('tuner'))toggleMic('tuner',false);});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeRadial();if(linkFrom){clearLink();renderScore();}return;}
    const editable=e.target.closest('input,select,textarea,[contenteditable]');
    if(e.ctrlKey||e.metaKey){
      const lower=e.key.toLowerCase();
      if(!editable&&!$('dialog').open&&(lower==='z'||lower==='y')){e.preventDefault();goHistory(lower==='y'||e.shiftKey?'redo':'undo');}
      if(lower==='s'&&!$('dialog').open){e.preventDefault();saveVersionDialog();}
      return;
    }
    if(editable||$('dialog').open||e.altKey)return;
    if(e.code==='Space'&&!e.target.closest('button,a')&&!e.repeat){e.preventDefault();toggle();return;}
    if(mode==='compose'&&/^[1-6]$/.test(e.key)&&!e.repeat){chooseDuration(Number(e.key)-1);return;}
    if(mode==='compose'&&selected&&!e.repeat){
      if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteNote();return;}
      if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();transposeNote(e.key==='ArrowUp'?1:-1);return;}
      if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
        e.preventDefault();const n=focusedNote();const t=Math.max(0,n.t+(e.key==='ArrowRight'?pref.grid:-pref.grid));
        updateNote({t,micro:0});setCursor(t);return;
      }
    }
    const i=keyShortcuts.indexOf(e.key.toLowerCase());
    if(i>=0&&!e.repeat){e.preventDefault();liveOn((pref.octave+1)*12+i,86,'kb:'+e.code);}
  });
  document.addEventListener('keyup',e=>liveOff('kb:'+e.code));
  window.addEventListener('blur',()=>{
    for(const key of heldVoices.keys())if(!key.startsWith('microphone')&&(key.startsWith('kb:')||key.startsWith('ptr')))liveOff(key);
  });
}
attachStudio();
